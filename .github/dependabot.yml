# Keeps dependencies and — importantly — the SHA-pinned GitHub Actions current.
# Pinning actions to a commit SHA closes the mutable-tag supply-chain hole, but
# it also means they stop receiving upstream fixes on their own; Dependabot is
# what keeps those pins moving. Do not remove one without the other.
#
# Tuned for cost. The first run opened 17 PRs at once, and with a private repo
# every one of those burns billable Actions minutes. So: monthly rather than
# weekly, a hard cap per ecosystem, and minor/patch bundled into a single PR.
# Majors are deliberately left ungrouped — they need reading, not a merge button.
#
# PAUSED 2026-08-24: open-pull-requests-limit is 0 on every ecosystem, which is
# the documented way to switch version updates off while keeping SECURITY
# updates flowing. The first sweep opened 17 PRs and burned most of a month's
# Actions budget. Raise these back to 3 once there is headroom — the grouping
# and monthly schedule below are already tuned so it stays at ~4 PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Test tooling churns constantly and never ships to users.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
