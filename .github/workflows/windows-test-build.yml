name: Windows test build

# An .exe you can actually install, without cutting a release.
#
# The same gap linux-test-build.yml was written to close, on the platform where
# it has cost the most. The release workflow only runs on a tag, so the only way
# to get a Windows installer was to tag one, which means a version bump, a
# throwaway branch, a draft release and a tag to delete afterwards. Verifying a
# one-line fix that way is absurd, so in practice nobody verified anything:
# between v1.0.0-beta.9 and v1.0.0-beta.13 no Windows build was produced at all,
# and five bugs that made the Windows release unbuildable or broken accumulated
# unnoticed (#120, #121, #122, #123).
#
# The sixth, #124, is the reason this file exists. Console windows flashing over
# the UI at launch is invisible to every automated check: the integration tests
# mock the hook that triggers it, and a process creation flag is not something
# an assertion can see. It needed a person watching a real Windows screen, and
# that person needs an installer to watch.
#
# Runs only when asked, so it costs nothing until it is wanted.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (blank = the default branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Identical to the release workflow's step, deliberately: an installer
      # built with a different Ghostscript than the one that ships would be
      # testing something nobody will ever run.
      #
      # Licence: Ghostscript is AGPL-3.0. See THIRD-PARTY-LICENSES.md.
      - name: Fetch Ghostscript sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10060/gs10060w64.exe'
          Invoke-WebRequest -Uri $url -OutFile gs-installer.exe -MaximumRetryCount 3
          # P012: verify before extracting anything from it.
          $sha = (Get-FileHash gs-installer.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "installer sha256: $sha"
          $expected = '8d552205c0fe87a16bac2f377c8a1b090cfcbc610db7c281bd6a646b39c9c468'
          if ($sha -ne $expected) {
            throw "Ghostscript installer checksum mismatch. Expected $expected, got $sha"
          }
          # Windows Ghostscript is gswin64c.exe PLUS gsdll64.dll, so the DLL is
          # placed beside the sidecar rather than the exe shipping alone.
          7z x gs-installer.exe -ogs-extracted -y | Out-Null
          Copy-Item gs-extracted/bin/gswin64c.exe "$env:GITHUB_WORKSPACE/src-tauri/binaries/papercut-gs-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item gs-extracted/bin/gsdll64.dll  "$env:GITHUB_WORKSPACE/src-tauri/binaries/gsdll64.dll" -Force
          & "$env:GITHUB_WORKSPACE/src-tauri/binaries/papercut-gs-x86_64-pc-windows-msvc.exe" --version

      - name: Verify a real Ghostscript is bundled
        shell: bash
        run: |
          set -euo pipefail
          BIN="src-tauri/binaries/papercut-gs-x86_64-pc-windows-msvc.exe"
          DLL="src-tauri/binaries/gsdll64.dll"
          # gswin64c.exe is a ~94 KB wrapper and gsdll64.dll is the engine, so
          # sizing the exe alone would reject a perfectly good Ghostscript. The
          # committed stub is under 100 bytes either way.
          SIZE=$(wc -c < "$BIN")
          if [ "$SIZE" -lt 10000 ]; then
            echo "$BIN is still a placeholder ($SIZE bytes)."; exit 1
          fi
          test -f "$DLL" || { echo "$DLL is missing; gswin64c.exe cannot start without it"; exit 1; }
          DLL_SIZE=$(wc -c < "$DLL")
          if [ "$DLL_SIZE" -lt 1000000 ]; then
            echo "$DLL is not a real Ghostscript engine ($DLL_SIZE bytes)."; exit 1
          fi
          echo "$BIN: $SIZE bytes"
          echo "$DLL: $DLL_SIZE bytes"

      # A release build, not --debug: the point is to test what a user installs.
      # windows_subsystem = "windows" only applies to a release profile, and a
      # debug build allocates a console of its own, which would make this
      # workflow report the exact defect it exists to disprove.
      - name: Build the installer
        run: npx tauri build --bundles nsis

      # Static proof of the console-window fix, so the download is not the only
      # evidence. This cannot see a window flash, but it can see whether the
      # source that produced this binary routes its spawns through the helper.
      - name: Report whether this build carries the CREATE_NO_WINDOW fix
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(grep -c 'std::process::Command::new(' src-tauri/src/lib.rs || true)
          QUIET=$(grep -c 'quiet_command(' src-tauri/src/lib.rs || true)
          echo "quiet_command call sites: $QUIET"
          echo "raw Command::new sites:   $RAW  (expected 2: the helper body and a macOS-only test)"
          if grep -q 'fn quiet_command' src-tauri/src/lib.rs && grep -q 'creation_flags' src-tauri/src/lib.rs; then
            echo "PASS: this build routes child processes through quiet_command (#124)"
          else
            echo "NOTE: this ref predates #124, so console windows will flash on launch"
          fi

      - name: Report what was built
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-Not $exe) { Write-Host "no installer was produced"; exit 1 }
          Write-Host "built: $($exe.FullName)"
          Write-Host "size:  $([math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "sha256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())"

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: papercut-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
