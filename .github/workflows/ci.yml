name: CI

on:
  # Deliberately NOT `push: ['**']`. With pull_request also enabled, every push
  # to a branch that has an open PR ran this whole workflow TWICE — that was
  # roughly half of all Actions minutes. PRs are covered by pull_request; main
  # keeps a post-merge safety net, minus docs-only commits.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
      - '.claude/**'
  pull_request:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [created]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which areas of the codebase changed to enable smart E2E triggering.
  # Runs on all events, but only applies filtering on PRs (other events always show as changed).
  # Currently no job consumes these outputs: the e2e jobs no longer run on
  # pull_request (see the note on e2e-pdf). Kept so path-based gating can be
  # wired straight back up when those suites are revived.
  detect-changes:
    runs-on: ubuntu-22.04
    outputs:
      pdf-changed: ${{ steps.filter.outputs.pdf }}
      image-changed: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect file changes (PR only; non-PR events always trigger E2E)
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            pdf:
              - '.github/workflows/ci.yml'
              - 'src/e2e/**'
              - 'src/e2e/tests/pdf-flows.test.ts'
              - 'src/lib/pdfProcessor*'
              - 'src-tauri/src/lib.rs'
            image:
              - '.github/workflows/ci.yml'
              - 'src/e2e/**'
              - 'src/e2e/tests/image-flows.test.ts'
              - 'src/lib/imageProcessor*'
              - 'src-tauri/src/lib.rs'

  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Version consistency check
        run: npm run version:check

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

  rust-checks:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check
        run: cd src-tauri && cargo check
        env:
          RUSTC_WRAPPER: sccache

      - name: Clippy lint
        run: cd src-tauri && cargo clippy -- -D warnings
        env:
          RUSTC_WRAPPER: sccache

  rust-integration:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev

      - name: Run Rust integration tests
        run: cd src-tauri && cargo test --lib -- --test-threads=4
        env:
          RUSTC_WRAPPER: sccache

  e2e-pdf:
    runs-on: ubuntu-22.04
    needs: [validate, rust-checks]
    # NOTE: deliberately NOT run on pull_request. These WebDriver suites are
    # blocked by an upstream panic in tauri-plugin-webdriver-automation 0.1.3:
    # `resolve()` does `.remove(&id).expect("no pending script with that id")`
    # while holding the pending-scripts Mutex, so a late or duplicate script
    # result poisons that Mutex and every later request fails with
    # "lock poisoned" — the session never recovers. They have not passed in any
    # recent CI run. PR coverage for these flows comes from rust-integration.
    # Still runnable on demand via the Actions "Run workflow" button, and on
    # release. See .planning/TEST_PLAN.md.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (webkit + GS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ghostscript

      - name: Install frontend dependencies
        run: npm ci

      - name: Install tauri-wd WebDriver
        run: cargo install tauri-webdriver-automation
        env:
          RUSTC_WRAPPER: sccache

      - name: Prepare GS sidecar (replace placeholder with system Ghostscript wrapper)
        run: |
          set -euo pipefail
          test -d src-tauri/binaries || { echo "ERROR: src-tauri/binaries not found"; exit 1; }
          test -x /usr/bin/gs || { echo "ERROR: /usr/bin/gs not found"; exit 1; }
          printf '#!/bin/sh\nexec /usr/bin/gs "$@"\n' > src-tauri/binaries/gs-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/gs-x86_64-unknown-linux-gnu
          echo "GS sidecar wrapper created successfully"

      - name: Build Tauri app (debug, for webdriver-automation plugin)
        run: npx tauri build --debug --features e2e --no-bundle
        env:
          RUSTC_WRAPPER: sccache

      - name: Prepare E2E fixtures
        run: |
          set -euo pipefail
          node src/e2e/fixtures/generate-e2e-fixtures.mjs
          cp -r test-fixtures /tmp/test-fixtures
          cp -r test-fixtures-e2e /tmp/test-fixtures-e2e
          mkdir -p /tmp/e2e-output

      - name: Run PDF E2E tests
        run: xvfb-run npm run test:e2e:pdf
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          E2E_FIXTURES_DIR: /tmp/test-fixtures-e2e
          E2E_REAL_FIXTURES_DIR: /tmp/test-fixtures
          E2E_OUTPUT_DIR: /tmp/e2e-output

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-pdf-screenshots
          path: .e2e-artifacts/screenshots/
          retention-days: 7

  e2e-image:
    runs-on: ubuntu-22.04
    needs: [validate, rust-checks]
    # NOTE: deliberately NOT run on pull_request. These WebDriver suites are
    # blocked by an upstream panic in tauri-plugin-webdriver-automation 0.1.3:
    # `resolve()` does `.remove(&id).expect("no pending script with that id")`
    # while holding the pending-scripts Mutex, so a late or duplicate script
    # result poisons that Mutex and every later request fails with
    # "lock poisoned" — the session never recovers. They have not passed in any
    # recent CI run. PR coverage for these flows comes from rust-integration.
    # Still runnable on demand via the Actions "Run workflow" button, and on
    # release. See .planning/TEST_PLAN.md.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (webkit, no GS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install tauri-wd WebDriver
        run: cargo install tauri-webdriver-automation
        env:
          RUSTC_WRAPPER: sccache

      - name: Build Tauri app (debug, for webdriver-automation plugin)
        run: npx tauri build --debug --features e2e --no-bundle
        env:
          RUSTC_WRAPPER: sccache

      - name: Prepare E2E fixtures
        run: |
          set -euo pipefail
          node src/e2e/fixtures/generate-e2e-fixtures.mjs
          cp -r test-fixtures /tmp/test-fixtures
          cp -r test-fixtures-e2e /tmp/test-fixtures-e2e
          mkdir -p /tmp/e2e-output

      - name: Run Image E2E tests
        run: xvfb-run npm run test:e2e:image
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          E2E_FIXTURES_DIR: /tmp/test-fixtures-e2e
          E2E_REAL_FIXTURES_DIR: /tmp/test-fixtures
          E2E_OUTPUT_DIR: /tmp/e2e-output

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-image-screenshots
          path: .e2e-artifacts/screenshots/
          retention-days: 7
