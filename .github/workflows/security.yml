name: Security

# Implements project rules P015 (npm audit) and P016 (gitleaks).
# Independent from ci.yml so a security failure surfaces clearly and never blocks unrelated work.

on:
  # Same duplication fix as ci.yml — see the note there. Secret scanning still
  # sees every PR, and every commit that lands on main.
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    # gitleaks-action reads the PR's commit list via the API on pull_request
    # events. That endpoint needed no scope while this repo was public, so the
    # workflow-level `contents: read` was enough; once the repo went private it
    # started returning 403 "Resource not accessible by integration" and the job
    # crashed — silently disabling the P016 gate on every PR. Granted here at job
    # level rather than workflow level so npm-audit keeps the narrower scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Custom ruleset — the default one cannot see base64-wrapped secrets.
          # See .gitleaks.toml for why that matters here.
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE: only needed for org-level dashboard (optional)

  npm-audit:
    name: Dependency audit (prod only)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (lockfile, no scripts)
        run: npm ci --ignore-scripts

      # npm audit exits 1 for two unrelated reasons: advisories were found, and
      # the registry could not be reached. Collapsing them means an npmjs.org
      # outage blocks every merge and reads like a security finding -- which is
      # what happened on 2026-09-04, red for 10m25s against a normal 31s.
      # Same shape as the gitleaks 403 recorded above: infrastructure failure
      # misread as a verdict. Retry the transient case, and keep the two apart
      # in the log. Still fails closed on a sustained outage: "could not check"
      # is not "clean".
      - name: npm audit (prod, fail on high+)
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --json > audit.json 2>/dev/null || true
            if jq -e '.metadata.vulnerabilities' audit.json >/dev/null 2>&1; then
              high=$(jq '.metadata.vulnerabilities.high' audit.json)
              crit=$(jq '.metadata.vulnerabilities.critical' audit.json)
              echo "high=$high critical=$crit"
              if [ "$high" -gt 0 ] || [ "$crit" -gt 0 ]; then
                echo "::error::High or critical advisories in production dependencies."
                npm audit --omit=dev --audit-level=high
                exit 1
              fi
              echo "No high or critical advisories in production dependencies."
              exit 0
            fi
            echo "Attempt $attempt of 3: audit endpoint unavailable."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error::npm audit endpoint unreachable after 3 attempts. This is a registry outage, not a finding. Dependabot alerts remain the standing control; re-run this job once registry.npmjs.org answers."
          exit 1
