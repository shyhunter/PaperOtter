name: Pages

# The landing page. A README is documentation for people who already found the
# project; this is for the ones who have not, and a desktop app needs somewhere
# to download it from that is not a source-code repository.
#
# Built from `site/`, which carries the page, the demo video, and the fonts and
# icons it used to pull from Google and jsDelivr. The page embeds no screenshots
# any more; the one copied in at publish time is the og:image a link preview
# renders, and it already lives in docs/screenshots/ for the README to use.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: read the tree, write only Pages, and prove the deployment
# came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight — a half-finished
# publish is a broken site rather than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Dormant until the repo is public. Pages serving publicly from a private
    # repo needs a paid plan, so `configure-pages` fails with "Get Pages site
    # failed" and leaves a red X on every push that touches the site. Like the
    # CodeQL gate, this removes itself at the visibility flip.
    #
    # An expression rather than a guard job: this workflow runs only on `push`
    # and `workflow_dispatch`, and both populate `github.event.repository`.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          # Provenance for the committed font binaries: repo documentation, not
          # a web asset.
          rm -f _site/fonts/README.md
          mkdir -p _site/screenshots
          cp docs/screenshots/dashboard-light.png _site/screenshots/
          # A missing asset on a download page reads as a broken product, so
          # fail the build here rather than ship one.
          for f in index.html \
                   fonts/bricolage-var.woff2 fonts/plex-sans-var.woff2 \
                   fonts/plex-mono-400.woff2 fonts/plex-mono-500.woff2 \
                   screenshots/dashboard-light.png \
                   media/share-card.jpg \
                   media/hero.mp4 media/hero-poster.jpg \
                   media/compress.mp4 media/compress-poster.jpg \
                   media/ebook.mp4 media/ebook-poster.jpg \
                   media/markdown.mp4 media/markdown-poster.jpg \
                   media/signature.mp4 media/signature-poster.jpg \
                   media/redact.mp4 media/redact-poster.jpg; do
            test -f "_site/$f" || { echo "missing asset: $f"; exit 1; }
          done
          # The page claims the product talks to nobody. It should not itself
          # fetch a font or a script from a third party, and this is the check
          # that keeps a future edit from quietly reintroducing one. Only
          # outbound links the reader clicks are allowed, plus two hosts that
          # are named but never fetched: schema.org is the JSON-LD vocabulary
          # identifier, and shyhunter.github.io is this site's own origin,
          # spelled absolutely because og:image and canonical require it.
          if grep -Eo 'https?://[a-zA-Z0-9.-]+' _site/index.html \
             | grep -vE '^https?://(github\.com|buymeacoffee\.com|www\.w3\.org|opensource\.org|schema\.org|shyhunter\.github\.io)$' \
             | sort -u | grep .; then
            echo "third-party resource host in index.html (listed above)"; exit 1
          fi
          echo "assembled:"; find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
