name: Linux build dependencies
description: >
  Installs the system packages a Tauri build needs on Ubuntu, with the
  downloaded .deb files cached between runs.

# Why this exists: GitHub's Ubuntu mirror is sometimes very slow. On
# 2026-10-22 two rust-integration runs spent 33 and 19+ minutes fetching 55 MB
# at ~28 kB/s, against 27 seconds on a good mirror. With the archives cached,
# a run only touches the mirror for packages that changed since the last save.
# CI-APT-01 pins this, and that no workflow installs these packages itself.

runs:
  using: composite
  steps:
    # One cache per runner image and package list, refreshed weekly so it
    # follows Ubuntu's security updates instead of growing stale. A miss only
    # costs today's speed: apt downloads whatever the cache lacks.
    # Caches saved on a PR branch serve only that branch; main's serve every
    # PR and tag. ci.yml never runs on main, so the weekly CodeQL schedule
    # (rust job, Mondays) is what keeps a main-scoped cache current.
    - name: Cache key
      id: key
      shell: bash
      # ImageOS (e.g. ubuntu22) is the runner's own variable: the shell sees it,
      # but `env.` in an expression only sees what the workflow defines.
      run: |
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:?runner did not set ImageOS}" >> "$GITHUB_OUTPUT"

    - name: Restore downloaded packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: apt-${{ steps.key.outputs.image }}-webkit41-${{ steps.key.outputs.week }}
        restore-keys: apt-${{ steps.key.outputs.image }}-webkit41-

    # Retries and a short timeout move apt on to the next mirror instead of
    # waiting the better part of a minute on a stalled one.
    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/apt-archives/partial
        sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10
        sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
          -o Dir::Cache::Archives="$HOME/apt-archives" \
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
        # apt leaves a root-owned lock and partial downloads; the cache is saved
        # by this user at the end of the job, so hand it back first.
        sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
